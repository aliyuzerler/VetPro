# VetCore ters vekil — Faz 15 üretim yapılandırması (TLS + güvenlik başlıkları).
# Sertifikalar kurulum sırasında infra/docker/certs/ dizinine yerleştirilir;
# depoya commit edilmez (docs/INSTALL.md).
#
# Sertifikasyon: fullchain.pem + privkey.pem (klinik alan adı için; iç CA veya
# Let's Encrypt uygunluğu müşteri tercihine göre). Sertifika yoksa yalnız 80
# dinleyicisi devreye girer ve kurulum adımı uyarı verir.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Vekil bağlantı yükseltmeleri
    proxy_http_version 1.1;

    # Kimlik uçları için katı hız bölgesi (uygulama içi limitin ikinci katmanı)
    limit_req_zone $binary_remote_addr zone=authzone:1m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=apizone:4m rate=600r/m;
    limit_req_status 429;

    # Ortak güvenlik başlıkları
    server_tokens off;

    # HTTP → HTTPS yönlendirme (sertifika kuruluysa)
    server {
        listen 80;
        server_name _;

        # ACME challenge (Let's Encrypt varsa) hariç tutulabilir; basit kurulumda
        # tüm trafiğe 301 döner.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Web yönetim arayüzü
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API — hız bölgeli
        location /api/ {
            limit_req zone=apizone burst=200 nodelay;
            proxy_pass http://api:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Kimlik uçları — katı hız
        location /api/v1/auth/ {
            limit_req zone=authzone burst=10 nodelay;
            proxy_pass http://api:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Yönetim portları (PostgreSQL/Redis/MinIO) dışarıya AÇILMAZ —
        # yalnızca internal backend ağından erişilir (docker-compose.yml).
    }
}
