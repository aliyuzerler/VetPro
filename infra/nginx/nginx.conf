# VetCore ters vekil (ters proxy) — Faz 01 temel yapılandırma.
# Üretimde TLS sonlandırması bu katmanda yapılır (docs/DEPLOYMENT.md).
# Sertifikalar kurulum sırasında müşteri ortamına göre yerleştirilir; depoya commit edilmez.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Temel güvenlik başlıkları (Faz 15'te genişletilir)
    server {
        listen 80;

        # Web yönetim arayüzü
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API
        location /api/ {
            proxy_pass http://api:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Yönetim portları (PostgreSQL/Redis/MinIO) dışarıya AÇILMAZ —
        # yalnızca iç Docker ağından erişilir (docs/DEPLOYMENT.md kuralı).
    }
}
