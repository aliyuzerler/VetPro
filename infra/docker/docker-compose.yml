# VetCore — tek müşteri kurulum altyapısı (docs/DEPLOYMENT.md).
# Temel servisler: `docker compose -f infra/docker/docker-compose.yml up -d`
# Uygulama servisleri: `docker compose -f infra/docker/docker-compose.yml --profile app up -d`
#
# Faz 15 sertleştirmesi:
#  - Zorunlu sırlar (.env) boşsa compose BİLİNÇLİ HATA verir; varsayılan parola yoktur.
#  - PostgreSQL/Redis/MinIO yönetim portları host'a HİÇ yayınlanmaz (yalnız iç ağ).
#  - Tüm servislerde no-new-privileges; arka uç ağı internal'dır (internet çıkışı yok).
#  - Yalnızca ters vekil (nginx, 80/443) ve web (gerekirse) host'a bağlıdır.

name: vetcore

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?infra/docker/.env içinde POSTGRES_USER belirleyin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/docker/.env içinde POSTGRES_PASSWORD belirleyin}
      POSTGRES_DB: ${POSTGRES_DB:?infra/docker/.env içinde POSTGRES_DB belirleyin}
      TZ: ${CLINIC_TIMEZONE:-Europe/Istanbul}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?infra/docker/.env içinde S3_ACCESS_KEY belirleyin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?infra/docker/.env içinde S3_SECRET_KEY belirleyin}
    volumes:
      - minio-data:/data
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Uygulama servisleri (profile: app) ---
  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET zorunlu (bkz. infra/docker/.env.example)}
      VETCORE_BACKUP_KEY: ${VETCORE_BACKUP_KEY:-}
      VETCORE_BACKUP_ALLOW_RESTORE: ${VETCORE_BACKUP_ALLOW_RESTORE:-false}
      VETCORE_LICENSE_SIGNING_KEY: ${VETCORE_LICENSE_SIGNING_KEY:-}
      VETCORE_CORS_ORIGINS: ${VETCORE_CORS_ORIGINS:-}
      VETCORE_RATE_LIMIT_AUTH: ${VETCORE_RATE_LIMIT_AUTH:-20}
      VETCORE_RATE_LIMIT_API: ${VETCORE_RATE_LIMIT_API:-600}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Europe/Istanbul}
    networks: [backend, frontend]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:4000
    networks: [frontend]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Ters vekil: TLS sonlandırma (infra/nginx/nginx.conf) — tek genel giriş.
  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Sertifikalar depoya commit edilmez; kurulumda bu dizine yerleştirilir:
      - ./certs:/etc/nginx/certs:ro
    networks: [frontend]
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  # Arka uç: yalnız iç servisler (internet erişimi yok).
  backend:
    internal: true
  # Ön uç: nginx ↔ web ↔ api.
  frontend:
